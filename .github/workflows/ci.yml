name: CodeMeet CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run frontend lint
        run: npm run lint --prefix frontend

      - name: Build backend Docker image
        run: docker build -t joy110407/codemeet-backend:latest ./backend

      - name: Build frontend Docker image
        run: docker build -t joy110407/codemeet-frontend:latest ./frontend

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: joy110407
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend Docker image
        run: docker push joy110407/codemeet-backend:latest

      - name: Push frontend Docker image
        run: docker push joy110407/codemeet-frontend:latest